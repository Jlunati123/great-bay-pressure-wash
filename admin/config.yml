backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

# NOTE: only add a field here once something on the site actually reads it.
# A field with no slot behind it saves happily and changes nothing, which
# is worse than no field at all.

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "tracking"
        label: "Tracking & Pixels"
        file: "data/tracking.json"
        fields:
          - label: "Meta (Facebook) Pixel ID"
            name: "meta_pixel_id"
            widget: "string"
            required: false
            hint: "Numeric ID from Meta Events Manager, e.g. 1234567890123456. Paste the ID only — not the whole script. Leave blank to turn the pixel off."
          - label: "Google Analytics 4 — Measurement ID"
            name: "ga4_id"
            widget: "string"
            required: false
            hint: "Looks like G-XXXXXXXXXX. Leave blank to turn GA4 off."
          - label: "Google Ads — Conversion ID"
            name: "google_ads_id"
            widget: "string"
            required: false
            hint: "Looks like AW-XXXXXXXXX. Leave blank to turn Google Ads tracking off."
          - label: "Advanced — extra code for <head>"
            name: "head_code"
            widget: "text"
            required: false
            hint: "Only needed for tags with no field above. Raw HTML/JS, added to the <head> of EVERY page. Anything pasted here runs on the whole site — only paste code you trust."
          - label: "Advanced — extra code for <body>"
            name: "body_code"
            widget: "text"
            required: false
            hint: "Raw HTML added at the start of every page's <body>. Usually only needed for <noscript> fallback tags."

  - name: "photos"
    label: "Site Photos"
    files:
      - name: "homepage"
        label: "Homepage & About Photos"
        file: "data/images.json"
        fields:
          - label: "Homepage — \"Why Choose Us\" Photo"
            name: "why_choose_photo"
            widget: "image"
            required: false
            hint: "The large photo beside the \"Why Choose Us\" text on the homepage. A team, truck, or job-site photo works best here."
          - label: "About Page — Team Photo"
            name: "team_photo"
            widget: "image"
            required: false
            hint: "The large photo beside \"Long Island Born. Long Island Proud.\" on the About page."

      - name: "house_washing"
        label: "House Washing Page Photo"
        file: "data/images-house-washing.json"
        fields:
          - label: "Before & After Photo"
            name: "before_after"
            widget: "image"
            required: false
            hint: "Shows on the House Washing page AND as the House Washing card on the homepage."

      - name: "roof_washing"
        label: "Roof Washing Page Photo"
        file: "data/images-roof-washing.json"
        fields:
          - label: "Before & After Photo"
            name: "before_after"
            widget: "image"
            required: false
            hint: "Shows on the Roof Washing page AND as the Roof Washing card on the homepage."

      - name: "driveway"
        label: "Driveway Cleaning Page Photo"
        file: "data/images-driveway.json"
        fields:
          - label: "Before & After Photo"
            name: "before_after"
            widget: "image"
            required: false
            hint: "Shows on the Driveway Cleaning page AND as the Driveway card on the homepage."

      - name: "patio"
        label: "Patio Cleaning Page Photo"
        file: "data/images-patio.json"
        fields:
          - label: "Before & After Photo"
            name: "before_after"
            widget: "image"
            required: false
            hint: "Shows on the Patio Cleaning page AND as the Patio card on the homepage."

      - name: "pavers"
        label: "Paver Cleaning & Sealing Page Photo"
        file: "data/images-pavers.json"
        fields:
          - label: "Before & After Photo"
            name: "before_after"
            widget: "image"
            required: false
            hint: "Shows on the Paver Cleaning page AND as the Paver card on the homepage."

      - name: "commercial"
        label: "Commercial Page Photo"
        file: "data/images-commercial.json"
        fields:
          - label: "Main Photo"
            name: "main"
            widget: "image"
            required: false
            hint: "Shows on the Commercial page AND as the Commercial card on the homepage."
